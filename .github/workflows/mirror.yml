name: Mirror UU Remote

on:
  push:
    branches: [main]
    paths: ['scripts/mirror.py', '.github/workflows/mirror.yml']
  workflow_dispatch:
    inputs:
      audit:
        description: 强制完整下载并计算 SHA-256（内容相同仍不重复发布）
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
    - cron: '43 3 * * *'

permissions:
  contents: read

concurrency:
  group: uuyc-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate archive logic
        run: python -m unittest discover -s tests -v
      - name: Probe, download, verify and publish
        env:
          FULL_AUDIT: ${{ inputs.audit == true || github.event.schedule == '43 3 * * *' }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$FULL_AUDIT" == "true" ]]; then args+=(--audit); fi
          python scripts/mirror.py --publish "${args[@]}"
      - name: Keep diagnostic metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mirror-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.json
            dist/*.txt
            dist/*.md
          if-no-files-found: ignore
          retention-days: 30
