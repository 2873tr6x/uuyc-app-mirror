name: One-shot historical backfill

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uuyc-history-backfill
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Validate history and mirror logic
        run: python -m unittest discover -s tests -v
      - name: Recover official historical packages into one Release
        run: python scripts/history.py --publish
      - name: Preserve backfill diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: historical-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/history/*.json
            dist/history/*.txt
            dist/history/*.md
          retention-days: 30
          if-no-files-found: ignore
