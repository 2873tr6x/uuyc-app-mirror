name: One-shot Windows signature recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uuyc-windows-signature-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Validate logic
        run: python -m unittest discover -s tests -v
      - name: Download official packages, verify Authenticode, and publish
        run: python scripts/windows-recover.py --publish
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-signature-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/windows-recovery/*.json
            dist/windows-recovery/*.txt
            dist/windows-recovery/*.md
          retention-days: 30
          if-no-files-found: ignore
